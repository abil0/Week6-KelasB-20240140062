<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Pesanan PAW6</title>
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/form.css">
</head>
<body>
  <header class="site-header">
    <h1>Toko PAW6</h1>
    <nav>
      <a href="index.html">Produk</a>
      <a href="form.html" class="active">Form Pesanan</a>
    </nav>
  </header>

  <main class="narrow">
    <section class="intro">
      <h2>Form Pesanan</h2>
      <p>Isi data anda</p>
    </section>

    <form id="order-form" novalidate>
      <div class="field">
        <label for="nama">Nama lengkap</label>
        <input type="text" id="nama" name="nama" autocomplete="name">
        <small class="error" id="err-nama"></small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email">
        <small class="error" id="err-email"></small>
      </div>

      <div class="field">
        <label for="produk">Produk</label>
        <select id="produk" name="produk">
          <option value="">Pilih produk</option>
          <option>Essence Mascara Lash Princess</option>
          <option>Eyeshadow Palette with Mirror</option>
          <option>Powder Canister</option>
          <option>Red Lipstick</option>
          <option>Red Nail Polish</option>
        </select>
        <small class="error" id="err-produk"></small>
      </div>

      <div class="field">
        <label for="jumlah">Jumlah</label>
        <input type="number" id="jumlah" name="jumlah" min="1" max="20" value="1">
        <small class="error" id="err-jumlah"></small>
      </div>

      <div class="field">
        <label for="catatan">Catatan <span class="muted">(opsional)</span></label>
        <textarea id="catatan" name="catatan" rows="3" maxlength="120"></textarea>
        <small class="muted" id="counter">0 / 120 karakter</small>
      </div>

      <button type="submit">Kirim pesanan</button>
    </form>

    <section id="result" class="result" hidden aria-live="polite"></section>
  </main>

  <footer>PAW6 &mdash; Nabil Rafif-062</footer>
  <script src="js/form.js"></script>
</body>
</html>
